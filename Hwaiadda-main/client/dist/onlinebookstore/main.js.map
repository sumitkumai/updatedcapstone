<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card p-4 shadow" style="width: 400px;">
    <h4 class="text-center">Reset Password</h4>
    <div class="alert alert-success" *ngIf="message">{{ message }}</div>
    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email">
      </div>
      <div class="mb-3">
        <label class="form-label">OTP</label>
        <input type="text" class="form-control" formControlName="otp" maxlength="6" placeholder="6-digit OTP">
      </div>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" formControlName="newPassword">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" formControlName="confirmPassword">
        <div class="text-danger small" *ngIf="form.get('confirmPassword')?.hasError('mismatch')">Passwords do not match</div>
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid">Reset Password</button>
    </form>
    <p class="text-center mt-3"><a routerLink="/login">Back to login</a></p>
  </div>
</div>
