<div class="auth-page page-enter">
  <div class="auth-card">
    <h2 class="section-title">Verify OTP</h2>
    <p class="text-muted">Enter the 6-digit code sent to <strong>{{ email }}</strong></p>

    <div class="alert alert-success" *ngIf="showMessage">{{ responseMessage }}</div>
    <div class="alert alert-danger" *ngIf="showError">{{ errorMessage }}</div>

    <form [formGroup]="otpForm" (ngSubmit)="onVerify()">
      <div class="mb-3">
        <label class="form-label">OTP</label>
        <input class="form-control" formControlName="otp" maxlength="6" placeholder="000000">
      </div>
      <button type="submit" class="btn-bharat-primary w-100" [disabled]="otpForm.invalid">Verify</button>
    </form>
    <p class="mt-3 text-center">
      <a routerLink="/register">Back to Register</a>
    </p>
  </div>
</div>
