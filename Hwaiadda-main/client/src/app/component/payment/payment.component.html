<div class="page-enter container py-4">
  <h3 class="section-title">Complete Payment</h3>
  <p class="text-muted">Booking ID: {{ bookingId }}</p>

  <div class="payment-card card-hover">
    <div class="amount-display">
      <span>Total Amount</span>
      <strong>₹{{ amount || bookingFlow.totalPrice || '—' }}</strong>
    </div>

    <div class="alert alert-success" *ngIf="showSuccess">Payment successful! Redirecting to your bookings...</div>
    <div class="alert alert-danger" *ngIf="showError">{{ errorMessage }}</div>

    <button class="btn-bharat-saffron w-100 mt-3" [disabled]="processing" (click)="pay()">
      {{ processing ? 'Processing...' : 'Pay Now' }}
    </button>
    <button class="btn btn-outline-secondary w-100 mt-2" routerLink="/my_booking">View My Bookings</button>
  </div>
</div>
