<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card p-4 shadow" style="width: 400px;">
    <h4 class="text-center">Forgot Password</h4>
    <p class="text-muted text-center">Enter your registered email to receive a reset OTP.</p>
    <div class="alert alert-success" *ngIf="message">{{ message }}</div>
    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email">
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid">Send OTP</button>
    </form>
    <p class="text-center mt-3"><a routerLink="/login">Back to login</a></p>
  </div>
</div>
